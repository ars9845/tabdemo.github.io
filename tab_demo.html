<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>탭탭 버튼 50</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 상단 고정 바(계정·구독) → 카테고리 칩 + 정렬 → 카드 그리드(카드 = 눌러보는 버튼 + 남은 횟수). 이펙트는 화면 전체 캔버스 1장. */
:root{
  --bg:#F1F3F7; --panel:#FFFFFF; --ink:#141720; --muted:#5E6677; --line:#DCE0E8; --soft:#E8EBF1;
  --accent:#1F6FEB; --gold:#F2B300; --ok:#0E9F6E; --warn:#E5484D;
  --bg-a:#F1F3F7; --panel-a:rgba(255,255,255,.86); --ok-soft:rgba(14,159,110,.16); --accent-soft:rgba(31,111,235,.10); --ink-soft:rgba(20,23,32,.12);
  --f-display:"Bricolage Grotesque","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1117; --panel:#161A22; --ink:#E8EBF2; --muted:#98A0B2; --line:#272C38; --soft:#1E232D;
  --accent:#5B9BFF; --gold:#FFC93C; --ok:#34C38F; --warn:#FF6B70; --bg-a:#0E1117; --panel-a:rgba(22,26,34,.86); --ok-soft:rgba(52,195,143,.18); --accent-soft:rgba(91,155,255,.14); --ink-soft:rgba(232,235,242,.14); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1117; --panel:#161A22; --ink:#E8EBF2; --muted:#98A0B2; --line:#272C38; --soft:#1E232D;
  --accent:#5B9BFF; --gold:#FFC93C; --ok:#34C38F; --warn:#FF6B70; --bg-a:#0E1117; --panel-a:rgba(22,26,34,.86); --ok-soft:rgba(52,195,143,.18); --accent-soft:rgba(91,155,255,.14); --ink-soft:rgba(232,235,242,.14); color-scheme:dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg-a);
  padding-block:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font:800 24px/1 var(--f-display);letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font:500 12px var(--f-body);color:var(--muted)}
.acct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:1 1 auto;min-width:0}
.who{font-size:13px;color:var(--muted)}
.who b{color:var(--ink)}
.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:700 14px var(--f-body);
  padding:9px 14px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1400}
.btn:focus-visible,.chip:focus-visible,select:focus-visible,.pad:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.demo{font-size:12px;color:var(--muted)}
.demo b{color:var(--warn)}
.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;min-width:0;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 13px var(--f-body);
  padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip span{color:var(--muted);font:500 11px var(--f-mono);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] span{color:var(--bg);opacity:.7}
.sort{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
select{font:600 13px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px}

.section-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.section-h h2{font:800 20px var(--f-display);margin:0}
.section-h p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 10px 12px;display:grid;gap:8px;position:relative;min-width:0}
.stage{position:relative;aspect-ratio:1/1;-webkit-touch-callout:none;border-radius:12px;background:var(--soft);display:grid;place-items:center;overflow:hidden;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad{--glow:0;--depth:0px;appearance:none;border:0;cursor:pointer;width:62%;aspect-ratio:1;max-width:100%;color:#fff;
  font:800 13px var(--f-display);letter-spacing:.03em;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  background:var(--c1);background:radial-gradient(circle at 35% 28%,var(--hi),var(--c1) 50%,var(--c2));
  box-shadow:0 calc(8px - var(--depth)) 0 var(--sh),0 10px 22px var(--gl),
  0 0 calc(var(--glow)*40px) calc(var(--glow)*10px) var(--gcol);
  text-shadow:0 1px 0 rgba(0,0,0,.2)}
.pad.circle{border-radius:50%}
.pad.rounded{border-radius:24%}
.pad.pill{width:78%;aspect-ratio:2/1;border-radius:999px}
.pad.square{border-radius:10px}
.pad.blob{border-radius:58% 42% 50% 50%/48% 56% 44% 52%}
.pad.key{border-radius:14px;background:linear-gradient(180deg,var(--hi2),var(--c1));
  box-shadow:inset 0 -6px 0 var(--kin),0 calc(8px - var(--depth)) 0 var(--sh2),0 10px 18px rgba(0,0,0,.2)}
.pad.neon{background:#0b0d14;color:var(--c1);border:3px solid var(--c1);text-shadow:0 0 8px var(--c1);
  box-shadow:0 0 calc(10px + var(--glow)*30px) var(--c1),inset 0 0 calc(8px + var(--glow)*20px) var(--c2)}
.pad.dome{width:60%;position:relative;z-index:1;color:#fff;font:700 clamp(11px,3.2vw,15px)/1.1 var(--f-body);letter-spacing:-.02em;word-break:keep-all;
  text-shadow:0 0 1px #E64980,0 1px 0 #E64980,1px 0 0 #E64980,-1px 0 0 #E64980,0 -1px 0 #E64980,0 2px 4px rgba(200,40,90,.45);
  box-shadow:inset 0 10px 16px rgba(255,255,255,.45),inset 0 -14px 22px rgba(255,80,50,.45),0 calc(5px - var(--depth)) 0 #F25F7A,
  0 6px 14px rgba(255,90,120,.35),0 0 calc(var(--glow)*36px) calc(var(--glow)*8px) rgba(255,143,168,.8)}
.dome-base{position:absolute;left:50%;top:50%;width:76%;aspect-ratio:1/1;transform:translate(-50%,-46%);border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#FFFFFF 0,#FFFFFF 58%,#F1E9EC 74%,#E2D6DB 100%);
  box-shadow:0 8px 16px rgba(80,40,60,.18),inset 0 -4px 6px rgba(0,0,0,.06),0 0 0 6px rgba(255,170,190,.18),0 0 0 14px rgba(255,170,190,.08)}
@supports not (aspect-ratio:1/1){.dome-base{height:76%}}
.pad.photo{border-radius:50%;background-color:#2E5E1F;background-size:cover;background-position:center;background-repeat:no-repeat;
  box-shadow:0 calc(8px - var(--depth)) 0 #1F3F14,0 10px 22px rgba(0,0,0,.28),inset 0 0 0 3px rgba(255,255,255,.35),0 0 calc(var(--glow)*40px) calc(var(--glow)*10px) rgba(242,179,0,.75)}
.card .pad.illu{width:82%;aspect-ratio:1/1;border:0;border-radius:0;background:none;box-shadow:none;text-shadow:none;padding:0;
  -webkit-filter:drop-shadow(0 6px 5px rgba(0,0,0,.18));filter:drop-shadow(0 6px 5px rgba(0,0,0,.18));transform-origin:50% 80%}
.card .pad.illu svg{display:block;width:100%;height:100%;pointer-events:none;overflow:visible}
.pad.illu .on-g{display:none}.pad.illu.on .on-g{display:inline}.pad.illu.on .off-g{display:none}
@supports not (aspect-ratio:1/1){.card .pad.illu{top:9%;left:9%;width:82%;height:82%}}
.pad.img{width:84%;border-radius:0;background-color:transparent;background-repeat:no-repeat;background-position:center;background-size:contain;box-shadow:none;transform-origin:50% 88%;-webkit-filter:drop-shadow(0 8px 8px rgba(0,0,0,.18));filter:drop-shadow(0 8px 8px rgba(0,0,0,.18))}
.pad:disabled{cursor:not-allowed}
.combo{position:absolute;top:6px;left:0;right:0;text-align:center;font:800 18px var(--f-display);font-variant-numeric:tabular-nums;pointer-events:none;color:var(--ink)}
.combo small{display:block;font:600 10px var(--f-mono);color:var(--muted)}
.gauge{position:absolute;left:12%;right:12%;bottom:8px;height:5px;border-radius:5px;background:var(--ink-soft);overflow:hidden;pointer-events:none}
.gauge i{display:block;height:100%;width:0;background:var(--c1)}
.lock{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;text-align:center;padding:10px;gap:6px;align-content:center;
  background:var(--panel-a);font-size:12px;color:var(--muted)}
.lock b{display:block;color:var(--ink);font-size:13px}
.lock .btn{padding:6px 10px;font-size:12px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0}
.name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.left{font:700 12px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.left.low{color:var(--warn)}
.left.inf{color:var(--ok)}
.sub{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);gap:6px}
.bar-left{height:3px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar-left i{display:block;height:100%;background:var(--accent);transition:width .15s}
.float{position:absolute;font:800 14px var(--f-display);color:var(--gold);pointer-events:none;animation:up .7s ease-out forwards;white-space:nowrap;
  text-shadow:0 1px 0 rgba(0,0,0,.25);z-index:3}
@keyframes up{to{transform:translateY(-46px);opacity:0}}
@supports not (aspect-ratio:1/1){.stage{height:0;padding-bottom:100%}.pad{position:absolute;top:19%;left:19%;width:62%;height:62%}.pad.pill{top:30%;left:11%;width:78%;height:39%}}
#fx{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:15;background:transparent;display:none}
#err{position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#B42318;color:#fff;font:12px/1.4 ui-monospace,Menlo,monospace;padding:10px;border-radius:10px;white-space:pre-wrap;word-break:break-all}

/* 모달 */
.scrim{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;background:rgba(10,12,18,.5);display:grid;place-items:end center;padding:16px;
  padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.scrim{place-items:center}}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:min(440px,100%);padding:20px;display:grid;gap:14px;max-height:90vh;overflow:auto}
.sheet h3{font:800 20px var(--f-display);margin:0}
.sheet p{margin:0}
.opt{appearance:none;width:100%;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:12px;padding:13px 14px;font:700 15px var(--f-body);cursor:pointer;text-align:left}
.opt .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:800 13px var(--f-display);flex:none;color:#fff}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
input[type=email]{width:100%;box-sizing:border-box;font:500 15px var(--f-body);padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.price{display:flex;align-items:baseline;gap:8px}
.price b{font:800 34px var(--f-display)}
.note{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100vw - 32px)}
@media (max-width:520px){.chips{flex:1 1 100%}.brand small{display:none}.acct .pill:not(.ok){display:none}.acct{justify-content:flex-start}.btn{padding:8px 11px;font-size:13px}}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.brand{font-size:20px}}
@media (prefers-reduced-motion: reduce){.float{animation-duration:.01s}}
</style>
</head>
<body>


<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="top">
    <div class="bar">
      <div class="brand">탭탭 버튼 50 <small>계속 누르고 싶은 버튼 모음</small></div>
      <div class="acct" id="acct"></div>
    </div>
    <div class="demo"><b>데모</b> 로그인과 결제는 실제로 연결되지 않습니다. 횟수는 이 기기에만 저장됩니다.</div>
    <div class="tools">
      <div class="chips" id="chips" role="group" aria-label="카테고리"></div>
      <label class="sort">정렬
        <select id="sort">
          <option value="cat">카테고리순</option>
          <option value="name">이름순</option>
          <option value="popular">많이 누른 순</option>
          <option value="left">남은 횟수 적은 순</option>
          <option value="new">추천순</option>
        </select>
      </label>
    </div>
  </header>
  <main id="list"></main>
</div>

<!-- 로그인 -->
<div class="scrim" id="m-login" hidden role="dialog" aria-modal="true" aria-labelledby="lg-t">
  <div class="sheet">
    <h3 id="lg-t">로그인</h3>
    <p class="note" id="lg-why">로그인하면 구독하고 모든 버튼을 무제한으로 누를 수 있어요.</p>
    <button class="opt" data-prov="kakao"><span class="ic" style="background:#E4B800;color:#2a2100">K</span><span>카카오로 계속하기<small>데모: 바로 로그인됩니다</small></span></button>
    <button class="opt" data-prov="google"><span class="ic" style="background:#4A6CF7">G</span><span>구글로 계속하기<small>데모: 바로 로그인됩니다</small></span></button>
    <div style="display:grid;gap:8px">
      <label class="note" for="lg-email">이메일로 로그인</label>
      <input type="email" id="lg-email" placeholder="name@example.com" autocomplete="email">
      <button class="btn ghost" id="lg-send">로그인 링크 받기</button>
      <p class="note" id="lg-msg" aria-live="polite"></p>
    </div>
    <div class="row"><button class="btn ghost" data-close>닫기</button></div>
  </div>
</div>

<!-- 구독 결제 -->
<div class="scrim" id="m-sub" hidden role="dialog" aria-modal="true" aria-labelledby="sb-t">
  <div class="sheet">
    <h3 id="sb-t">무제한 이용권</h3>
    <div class="price"><b>500원</b><span class="note">30일 · 자동 연장 없음</span></div>
    <p class="note">50개 버튼 모두 하루 30번 제한 없이 누를 수 있어요. 30일이 지나면 다시 결제하면 됩니다.</p>
    <div role="radiogroup" aria-label="결제 수단" style="display:grid;gap:8px" id="pay">
      <button class="opt" role="radio" aria-checked="true" data-pay="card"><span class="ic" style="background:#3B4A6B">카</span><span>신용·체크카드</span></button>
      <button class="opt" role="radio" aria-checked="false" data-pay="trans"><span class="ic" style="background:#0E9F6E">이</span><span>실시간 계좌이체</span></button>
      <button class="opt" role="radio" aria-checked="false" data-pay="easy"><span class="ic" style="background:#8A5CF6">간</span><span>간편결제<small>실서비스에서 포트원으로 연결할 예정</small></span></button>
    </div>
    <p class="note">데모라서 카드번호나 계좌 정보를 받지 않고, 실제로 청구되지 않습니다.</p>
    <div class="row"><button class="btn ghost" data-close>닫기</button><button class="btn gold" id="sb-pay">500원 결제하기 (데모)</button></div>
  </div>
</div>

<!-- 내 계정 -->
<div class="scrim" id="m-me" hidden role="dialog" aria-modal="true" aria-labelledby="me-t">
  <div class="sheet">
    <h3 id="me-t">내 계정</h3>
    <p id="me-info"></p>
    <p class="note" id="me-sub"></p>
    <div class="row">
      <button class="btn ghost" id="me-reset">오늘 횟수 초기화 (데모)</button>
      <button class="btn ghost" id="me-out">로그아웃</button>
      <button class="btn" data-close>닫기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<div id="err" hidden></div>
<script>
// 문제 진단: 오류가 나면 화면 아래 빨간 상자로 표시 (스크린샷 보내주시면 바로 고칠 수 있음)
function showErr(m){ var e=document.getElementById('err'); if(!e) return; e.hidden=false; e.textContent='오류: '+m+'\n'+navigator.userAgent; }
window.addEventListener('error',function(ev){ showErr((ev.message||'알 수 없는 오류')+(ev.lineno?' (줄 '+ev.lineno+')':'')); });
window.addEventListener('unhandledrejection',function(ev){ showErr(String(ev.reason)); });
</script>
<script>
(() => {
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LIMIT=30;

/* ============ 카테고리 & 버튼 50개 ============ */
const CATS=[
  {id:'spring', name:'스프링', desc:'튕겨 나오는 탄성'},
  {id:'jelly',  name:'말랑',   desc:'눌리고 출렁이는 촉감'},
  {id:'burst',  name:'팡팡',   desc:'터지는 파티클'},
  {id:'mech',   name:'딸깍',   desc:'기계식 키와 스위치'},
  {id:'combo',  name:'콤보',   desc:'연타할수록 커지는 보상'},
  {id:'lucky',  name:'럭키',   desc:'가끔 터지는 랜덤 보상'},
  {id:'neon',   name:'네온',   desc:'빛나고 번쩍이는'},
  {id:'nature', name:'자연',   desc:'물방울·눈·낙엽'},
];

const svg=(defs,body)=>`<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true" focusable="false"><defs>${defs}</defs>${body}</svg>`;

/* ============ 색 계산 (Safari 구버전은 CSS color-mix 미지원 → JS로 계산) ============ */
function rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255]}
function mix(h,toward,t){const a=rgb(h),b=toward==='#fff'?[255,255,255]:[0,0,0];return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')'}
function alpha(h,a){return 'rgba('+rgb(h).join(',')+','+a+')'}
function softColor(){return getComputedStyle(document.documentElement).getPropertyValue('--soft').trim()||'#E8EBF1'}

const state={}; // id -> {x,v,target,k,c,rot,rv,shake,combo,taps,lastDown,downs,on,held,gauge}
const active=new Set(); let physOn=false, physLast=0;

  const dt=Math.min(.032,(t-(physLast||t))/1000)||.016; physLast=t; const now=performance.now();

    const s=st(id), b=BY[id], P=PHY[b.phy], h=dt/4;

    if(b.depth){ ty=b.depth*Math.max(0,Math.min(1.2,press)); s.el.style.setProperty('--depth',ty+'px'); if(b.shape==='key') { sx=sy=1; } }

  if(b.wobble) s.rv+=(Math.random()<.5?-1:1)*b.wobble*20;
  if(b.shake) s.shake=b.shake;
  if(b.toggle){ s.on=!s.on; if(b.illu) c.pad.classList.toggle('on',s.on); else { setPadColors(c.pad,s.on?'#FFE066':b.c1,s.on?'#F59F00':b.c2,b.gc); c.pad.textContent=s.on?'ON':'OFF'; } }
  // 콤보
  if(b.combo){
    if(b.combo==='rhythm'){ if(s.combo===0||!s.lastIti){s.combo=1} else if(Math.abs(iti-s.lastIti)/s.lastIti<.18){ s.combo++; if(s.combo%4===0){floatText(c.stage,'PERFECT');ring(c.pad,b.c1)} } else s.combo=1; s.lastIti=iti; }
    else { s.combo++; }
    if(b.combo==='scale'||b.combo==='drum'){ if(s.combo%10===0){floatText(c.stage,'×'+(1+s.combo/10));ring(c.pad,'#FFD43B')} }
    if(b.combo==='level'&&s.combo%10===0){ floatText(c.stage,'LEVEL UP'); spawn('star',16,c.pad,b,true); jackpotSound(false); }
    if(b.combo==='gauge'&&s.combo>=40){ floatText(c.stage,'MAX POWER'); spawn('spark',30,c.pad,b,true); ring(c.pad,b.c1,1); s.combo=0; haptic([30,20,30]); }
    if(b.combo==='tps'&&s.tps>=8&&s.taps%5===0) floatText(c.stage,s.tps+' TPS!');
    updateCombo(id);
  }
  sound(b,s); haptic(b.hap);
  if(b.ring) for(let i=0;i<b.ring;i++) setTimeout(()=>ring(c.pad,b.c1,.6+i*.25),i*70);
  if(b.parts) spawn(b.parts[0],b.parts[1],c.pad,b,false);
  if(b.flash&&!reduce) c.stage.animate([{backgroundColor:b.c1},{backgroundColor:softColor()}],{duration:220});
  // 랜덤 보상
  if(b.lucky&&Math.random()<b.lucky){
    if(b.mystery){ const r=['star','confetti','bubble','spark','leaf','snow'][Math.random()*6|0]; spawn(r,30,c.pad,b,true); floatText(c.stage,'SURPRISE'); jackpotSound(false); }
    else if(b.small){ spawn('star',10,c.pad,b,false); floatText(c.stage,'LUCKY','#51CF66'); if(soundOn) tone(1320,null,.3,'sine',.1); }
    else { spawn('confetti',b.big?60:36,c.pad,b,true); ring(c.pad,'#FFD43B',1); floatText(c.stage,b.big?'JACKPOT!!':'JACKPOT'); jackpotSound(b.big); haptic([20,30,40]);
      if(!reduce) c.stage.animate([{backgroundColor:'#FFD43B'},{backgroundColor:softColor()}],{duration:320}); }
  }
  active.add(id); ensurePhys(); refreshCard(id);
}
function release(id){ const b=BY[id], s=st(id); if(s.held<=0) return; s.held--; if(s.held===0){ const P=PHY[b.phy]; s.target=1; s.k=P.kR; s.c=P.cR; active.add(id); ensurePhys(); } }
list.addEventListener('pointerdown',e=>{ const pad=e.target.closest('.pad'); if(!pad) return; e.preventDefault(); try{pad.setPointerCapture(e.pointerId)}catch(_){}
  press(pad.closest('.card').dataset.id,e.timeStamp); });
list.addEventListener('pointerup',e=>{ const pad=e.target.closest('.pad'); if(pad) release(pad.closest('.card').dataset.id); });
list.addEventListener('pointercancel',e=>{ const pad=e.target.closest('.pad'); if(pad) release(pad.closest('.card').dataset.id); });
list.addEventListener('touchend',e=>{ if(e.target.closest('.pad')) { e.preventDefault(); unlockAudio(); } },{passive:false});
list.addEventListener('contextmenu',e=>{ if(e.target.closest('.pad')) e.preventDefault(); });
list.addEventListener('keydown',e=>{ const pad=e.target.closest('.pad'); if(pad&&(e.key===' '||e.key==='Enter')&&!e.repeat){ e.preventDefault(); press(pad.closest('.card').dataset.id); } });
list.addEventListener('keyup',e=>{ const pad=e.target.closest('.pad'); if(pad&&(e.key===' '||e.key==='Enter')){ e.preventDefault(); release(pad.closest('.card').dataset.id); } });
list.addEventListener('click',e=>{ if(e.target.closest('[data-act="sub"]')) startSubscribe(); });

/* ============ 필터 & 정렬 ============ */
let catSel='all', sortSel=store.get('sort','cat');
const chips=$('#chips');
function renderChips(){
  chips.innerHTML='';
  [{id:'all',name:'전체'},...CATS].forEach(c=>{ const b=document.createElement('button'); b.className='chip'; b.dataset.cat=c.id;
    b.setAttribute('aria-pressed',String(c.id===catSel)); b.textContent=c.name;
    const n=document.createElement('span'); n.textContent=c.id==='all'?BUTTONS.length:BUTTONS.filter(x=>x.cat===c.id).length; b.appendChild(n); chips.appendChild(b); });
}
chips.addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; catSel=b.dataset.cat; renderChips(); renderList(); });
$('#sort').value=sortSel; $('#sort').addEventListener('change',e=>{ sortSel=e.target.value; store.set('sort',sortSel); renderList(); });
function sorted(items){
  const a=items.slice(), ci=id=>CATS.findIndex(c=>c.id===BY[id].cat);
  if(sortSel==='name') a.sort((x,y)=>BY[x].name.localeCompare(BY[y].name,'ko'));
  else if(sortSel==='popular') a.sort((x,y)=>(totals[y]||0)-(totals[x]||0)||ci(x)-ci(y));
  else if(sortSel==='left') a.sort((x,y)=>{const lx=left(x),ly=left(y);return (lx===ly?0:lx<ly?-1:1)||ci(x)-ci(y)});
  else if(sortSel==='new') a.sort((x,y)=>{const ix=ORDER_REC.indexOf(x),iy=ORDER_REC.indexOf(y);return (ix<0?99:ix)-(iy<0?99:iy)||ci(x)-ci(y)});
  else a.sort((x,y)=>ci(x)-ci(y));
  return a;
}
function renderList(){
  list.innerHTML='';
  const ids=sorted(BUTTONS.filter(b=>catSel==='all'||b.cat===catSel).map(b=>b.id));
  const grouped = sortSel==='cat';
  if(grouped){
    CATS.filter(c=>catSel==='all'||c.id===catSel).forEach(c=>{
      const h=document.createElement('div'); h.className='section-h'; h.innerHTML='<h2></h2><p></p>';
      h.firstChild.textContent=c.name; h.lastChild.textContent=c.desc+' · '+BUTTONS.filter(b=>b.cat===c.id).length+'개';
      const g=document.createElement('div'); g.className='grid';
      ids.filter(id=>BY[id].cat===c.id).forEach(id=>g.appendChild(cards[id].card));
      list.append(h,g);
    });
  } else {
    const h=document.createElement('div'); h.className='section-h'; h.innerHTML='<h2></h2><p></p>';
    h.firstChild.textContent=catSel==='all'?'전체 버튼':CATS.find(c=>c.id===catSel).name; h.lastChild.textContent=ids.length+'개 · '+$('#sort').selectedOptions[0].textContent;
    const g=document.createElement('div'); g.className='grid'; ids.forEach(id=>g.appendChild(cards[id].card)); list.append(h,g);
  }
}

/* ============ 계정 · 구독 (데모) ============ */
const acct=$('#acct');
function fmtDate(d){ return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric'}).format(new Date(d)); }
function dLeft(){ return Math.max(0,Math.ceil((new Date(sub.until)-new Date())/86400000)); }
function renderAcct(){
  acct.innerHTML='';
  const snd=document.createElement('button'); snd.className='btn ghost'; snd.textContent=soundOn?'소리 켬':'소리 끔'; snd.setAttribute('aria-pressed',String(soundOn));
  snd.onclick=()=>{ soundOn=!soundOn; store.set('sound',soundOn); renderAcct(); };
  if(!auth){
    const w=document.createElement('span'); w.className='pill'; w.textContent='비로그인 · 버튼당 하루 30번';
    const lg=document.createElement('button'); lg.className='btn ghost'; lg.textContent='로그인'; lg.onclick=()=>openLogin(false);
    const sb=document.createElement('button'); sb.className='btn gold'; sb.textContent='무제한 500원'; sb.onclick=startSubscribe;
    acct.append(w,snd,lg,sb);
  } else if(!isSub()){
    const w=document.createElement('span'); w.className='who'; w.innerHTML='<b></b> · 하루 30번'; w.firstChild.textContent=auth.name;
    const me=document.createElement('button'); me.className='btn ghost'; me.textContent='내 계정'; me.onclick=openMe;
    const sb=document.createElement('button'); sb.className='btn gold'; sb.textContent='무제한 500원'; sb.onclick=startSubscribe;
    acct.append(w,snd,me,sb);
  } else {
    const p=document.createElement('span'); p.className='pill ok'; p.textContent='무제한 · D-'+dLeft();
    const me=document.createElement('button'); me.className='btn ghost'; me.textContent=auth.name; me.onclick=openMe;
    acct.append(p,snd,me);
  }
}
let afterLogin=null, lastFocus=null;
function openModal(id){ lastFocus=document.activeElement; $(id).hidden=false; const f=$(id).querySelector('button,input'); f&&f.focus(); }
function closeModal(el){ el.hidden=true; lastFocus&&lastFocus.focus&&lastFocus.focus(); }
$$('.scrim').forEach(s=>{ s.addEventListener('click',e=>{ if(e.target===s||e.target.closest('[data-close]')) closeModal(s); });
  s.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(s); }); });
function openLogin(forSub){ afterLogin=forSub?'sub':null; $('#lg-why').textContent=forSub?'구독하려면 먼저 로그인해 주세요.':'로그인하면 구독하고 모든 버튼을 무제한으로 누를 수 있어요.'; $('#lg-msg').textContent=''; openModal('#m-login'); }
function loggedIn(a){ auth=a; store.set('auth',auth); closeModal($('#m-login')); toast(a.name+'(으)로 로그인했어요.'); refreshAll(); if(afterLogin==='sub'){ afterLogin=null; setTimeout(()=>openModal('#m-sub'),150); } }
$$('#m-login [data-prov]').forEach(b=>b.addEventListener('click',()=>{ const p=b.dataset.prov; loggedIn({prov:p,name:p==='kakao'?'카카오 사용자':'구글 사용자'}); }));
$('#lg-send').addEventListener('click',()=>{ const v=$('#lg-email').value.trim(); if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ $('#lg-msg').textContent='이메일 주소 형식을 확인해 주세요. 예: name@example.com'; return; }
  $('#lg-msg').textContent='데모라서 메일을 보내지 않고 바로 로그인합니다.'; setTimeout(()=>loggedIn({prov:'email',name:v.split('@')[0]}),600); });
function startSubscribe(){ if(isSub()){ toast('이미 무제한 이용 중이에요.'); return; } if(!auth){ openLogin(true); return; } openModal('#m-sub'); }
let payMethod='card';
$$('#pay .opt').forEach(o=>o.addEventListener('click',()=>{ payMethod=o.dataset.pay; $$('#pay .opt').forEach(x=>x.setAttribute('aria-checked',String(x===o))); }));
$('#sb-pay').addEventListener('click',()=>{
  // 실서비스: 포트원 결제창 호출 → 서버에서 결제 금액(500원) 검증 → 구독 만료일 저장. 여기서는 데모로 바로 처리.
  const until=new Date(Date.now()+30*86400000).toISOString(); sub={until,method:payMethod}; store.set('sub',sub);
  closeModal($('#m-sub')); refreshAll(); toast('결제 완료(데모). '+fmtDate(until)+'까지 모든 버튼 무제한이에요.');
  spawn('confetti',50,$('#acct'),{c1:'#F2B300',c2:'#1F6FEB'},true); jackpotSound(true);
});
function openMe(){
  $('#me-info').textContent=auth.name+' · '+({kakao:'카카오',google:'구글',email:'이메일'}[auth.prov])+' 로그인';
  $('#me-sub').textContent=isSub()?('무제한 이용권: '+fmtDate(sub.until)+'까지 ('+({card:'카드',trans:'계좌이체',easy:'간편결제'}[sub.method])+')'):'구독하지 않음 · 버튼당 하루 30번';
  openModal('#m-me');
}
$('#me-out').addEventListener('click',()=>{ auth=null; store.set('auth',null); closeModal($('#m-me')); refreshAll(); toast('로그아웃했어요. 구독 혜택은 다시 로그인하면 이어집니다.'); });
$('#me-reset').addEventListener('click',()=>{ daily={date:today(),c:{}}; store.set('daily',daily); sub=null; store.set('sub',null); closeModal($('#m-me')); refreshAll(); toast('오늘 횟수와 이용권을 초기화했어요.'); });

let toastT=0; function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

try{ renderChips(); renderList(); refreshAll(); }catch(e){ showErr((e&&e.message)+' @ '+((e&&e.stack)||'').split('\n')[0]); }
})();
</script>
